<!DOCTYPE html>
<html>
<head>
  <title>Duel Arena Online</title>

  <style>
    body {
      margin: 0;
      background: #101216;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    button {
      padding: 16px 26px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #joinButton {
      background: #4fd1ff;
    }

    #status {
      margin: 25px;
      color: #aaa;
      font-size: 18px;
    }

    #players {
      margin-top: 20px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<h1>DUEL ARENA ONLINE</h1>

<p>
Play against another real player.
</p>

<button id="joinButton">
  JOIN ONLINE MATCH
</button>

<div id="status">
  Not connected
</div>

<div id="players"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

let socket = null;

const joinButton =
document.getElementById("joinButton");

const status =
document.getElementById("status");

const players =
document.getElementById("players");


joinButton.onclick =
function() {

  status.textContent =
  "Connecting...";

  /*
  CHANGE THIS ADDRESS
  after we publish your server.
  */

  socket =
  io(
    "https://YOUR-SERVER.onrender.com"
  );


  socket.on(
    "connect",
    function() {

      status.textContent =
      "Connected. Looking for opponent...";

      socket.emit(
        "joinQueue",
        {
          weapon:
          localStorage.getItem("weapon")
          ||
          "Starter Pistol"
        }
      );

    }
  );


  socket.on(
    "waiting",
    function() {

      status.textContent =
      "Waiting for another player...";

    }
  );


  socket.on(
    "matchFound",
    function(data) {

      status.textContent =
      "Opponent found!";

      players.innerHTML =
      `
      PLAYER 1
      <br>
      VS
      <br>
      PLAYER 2
      `;

      /*
      Store the match ID so game.html
      knows which online match to join.
      */

      localStorage.setItem(
        "matchId",
        data.matchId
      );

      setTimeout(
        function() {

          window.location.href =
          "multiplayer-game.html";

        },
        1500
      );

    }
  );


  socket.on(
    "disconnect",
    function() {

      status.textContent =
      "Disconnected";

    }
  );

};

</script>

</body>
</html>
